<!DOCTYPE html>
<html>

<head>
    <title>Memory Game</title>

    <link rel="stylesheet" 
            href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="memory-page">

    <a href="/games">
        <button>Back to Home Page</button>

    </a>

    <h1>Memory Game</h1>

    <div class="box">





    </div>

    <p id="moves">Moves: 0</p>

    <p id="timer"> Time: 0 second</p>

    <p id="result"></p>

    {% if small is not none %}
        <p>Best Moves: {{small}}</p>
    {% else %}
        <p>No games played yet</p>
    {% endif %}

    <button id="reset">RESET</button>

    <button id="prev">Previous games</button>

        <div id="prev_popup">

            <div id="prev_box">

                <h2>Previous Games:</h2>

                <table>
                    
                    <tr>
                        <th>Game</th>
                        <th>Moves</th>
                        <th>Time</th>
                        <th>Result</th>
                    </tr>
                
                    {% for i in records %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ i[0] }}</td> 
                        <td>{{ i[1] }}</td> 
                        <td>{{ i[2] }}</td>
                    </tr>
                    {% endfor %}
                
                </table>

                <button id="btg">Back-to-Game</button>
            
            </div>
        
        </div>

    



        <script src="{{ url_for('static', filename='js/memory.js') }}"></script>

    </body>






</html>
