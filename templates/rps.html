<!DOCTYPE html>
<html>

<head>

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="rps-page">

    <a href="/games">
        <button>Back to home page</button>
    </a>

    <h1>Rock Paper Scissors</h1>

    <div class="choices">

        <button class="rps-choice" data-choice="rock">
            <img src="{{ url_for('static', filename='images/rock-emoji.png') }}">
        </button>

        <button class="rps-choice" data-choice="paper">
            <img src="{{ url_for('static', filename='images/paper-emoji.png') }}">
        </button>

        <button class="rps-choice" data-choice="scissors">
            <img src="{{ url_for('static', filename='images/scissors-emoji.png') }}">
        </button>

    </div>


    <div class="result-section">

        <div class="player-choice">

            <h2>You went with:</h2>

            <img id="player-image"
                 class="player_image"
                 src="">

        </div>

        <h2 id="result"></h2>

        <div class="computer-choice">

            <h2>Computer chose:</h2>

            <img id="comp-image"
                 class="comp_image"
                 src="">

        </div>

    </div>


    <button id="results">LIFETIME RESULTS</button>

    <div id="results-popup">

        <div class="results-box">

            <h2>LIFETIME RESULTS</h2>

                <p class="username">{{username}}</p>

                <p> Wins: {{record[0]}}</p>
                <p> Losses: {{record[1]}}</p>
                <p> Draws: {{record[2]}}</p>

                <button id="btg">Back-to-Game</button>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/rps.js') }}"></script>

</body>

</html>
