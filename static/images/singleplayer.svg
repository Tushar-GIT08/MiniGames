  <circle cx="112" cy="176" r="3" fill="#0f0f14"/><circle cx="288" cy="176" r="3" fill="#0f0f14"/>
  <ellipse cx="160" cy="150" rx="26" ry="7" fill="#101016"/>
  <rect x="153" y="78" width="14" height="74" rx="6" fill="url(#shaft)"/>
  <circle cx="160" cy="66" r="32" fill="url(#ball)"/>
  <ellipse cx="149" cy="52" rx="9" ry="6" fill="#fff" opacity="0.55" transform="rotate(-30 149 52)"/>
  <circle cx="226" cy="172" r="12" fill="#22e58b"/>
