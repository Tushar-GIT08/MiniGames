  <text x="200" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="22" fill="#22e58b">+</text>

  <text x="200" y="250" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="25" fill="#fff" letter-spacing="2">PLAY WITH A FRIEND</text>
