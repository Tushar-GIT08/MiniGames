      <rect x="0" y="0" width="140" height="70" rx="34" fill="currentColor"/>
      <rect x="6" y="3" width="128" height="26" rx="13" fill="#fff" opacity="0.12"/>
      <circle cx="34" cy="28" r="10" fill="#000" opacity="0.4"/>
      <circle cx="34" cy="28" r="6" fill="#000" opacity="0.35"/>
      <rect x="47" y="43" width="22" height="7" rx="2" fill="#000" opacity="0.45"/>
      <rect x="54.5" y="35.5" width="7" height="22" rx="2" fill="#000" opacity="0.45"/>
      <circle cx="90" cy="46" r="8" fill="#000" opacity="0.4"/>
      <circle cx="106" cy="20" r="5.5" fill="#22e58b"/>
      <circle cx="118" cy="31" r="5.5" fill="#fff" opacity="0.9"/>
      <circle cx="94" cy="31" r="5.5" fill="#fff" opacity="0.9"/>
      <circle cx="106" cy="42" r="5.5" fill="#fff" opacity="0.9"/>
